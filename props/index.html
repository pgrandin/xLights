<!doctype html>
<!-- Deploy: lab deploy props --name props   (serves http://props.lab.lan). Data lives in props.json. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prop Build Queue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column. Controller port strip on top (the capacity every prop competes for), then the queue grouped by status. */
:root {
  --bg: #eef1ef; --surface: #ffffff; --ink: #17201c; --muted: #5b6862; --line: #d3dad6;
  --red: #b3122e; --green: #1d7347; --amber: #9a6200; --blue: #2457a6; --off: #7c8782;
  --red-bg: #f8e3e7; --green-bg: #e0f1e7; --amber-bg: #f7ecd6; --blue-bg: #e2eaf7; --off-bg: #e6eae8;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --surface: #1a221e; --ink: #e4ebe7; --muted: #9aa7a0; --line: #2c3631;
  --red: #ff6b7f; --green: #5fd395; --amber: #f0b24a; --blue: #8fb4ff; --off: #8a9690;
  --red-bg: #3a1a21; --green-bg: #173325; --amber-bg: #392a12; --blue-bg: #1b2840; --off-bg: #242c28; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121815; --surface: #1a221e; --ink: #e4ebe7; --muted: #9aa7a0; --line: #2c3631;
  --red: #ff6b7f; --green: #5fd395; --amber: #f0b24a; --blue: #8fb4ff; --off: #8a9690;
  --red-bg: #3a1a21; --green-bg: #173325; --amber-bg: #392a12; --blue-bg: #1b2840; --off-bg: #242c28; color-scheme: dark }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 28px; }
h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: 2.6rem; line-height: 1; }
h2 { font-size: 1.35rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.label { font: 500 .72rem/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Controller strip */
.ctrl { display: grid; gap: 10px; }
.ctrl-head { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.ports { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; }
.port { border: 1px solid var(--line); border-radius: 4px; padding: 6px 2px 5px; text-align: center; background: var(--surface); min-width: 0; }
.port b { display: block; font: 500 .8rem/1 var(--mono); }
.port span { display: block; margin-top: 4px; font: .62rem/1.1 var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.port.free { border-style: dashed; border-color: var(--green); background: var(--green-bg); }
.port.free span { color: var(--green); }
.port.full span { color: var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .82rem; color: var(--muted); }
@media (max-width: 560px) { .ports { grid-template-columns: repeat(8, minmax(0, 1fr)); } }

/* Queue */
.group { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.card-top { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.card h3 { margin: 0; font: 600 1.05rem/1.35 var(--body); text-wrap: balance; min-width: 0; flex: 1 1 320px; }
.card h3 a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
.card h3 a:hover, .card h3 a:focus-visible { text-decoration-color: var(--red); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--muted); }
.rows { display: grid; gap: 8px; margin: 0; }
.rows div { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 12px; }
.rows dt { padding-top: 3px; }
.rows dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.rows dd a { color: var(--blue); text-underline-offset: 3px; }
@media (max-width: 560px) { .rows div { grid-template-columns: 1fr; gap: 2px; } }
.need dd { color: var(--amber); }

.status { font: 600 .78rem/1 var(--body); border-radius: 999px; padding: 6px 10px; border: 1px solid transparent; white-space: nowrap; }
.card h3 a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.s-review { color: var(--amber); background-color: var(--amber-bg); }
.s-short { color: var(--blue); background-color: var(--blue-bg); }
.s-build { color: var(--red); background-color: var(--red-bg); }
.s-built { color: var(--green); background-color: var(--green-bg); }
.s-passed { color: var(--off); background-color: var(--off-bg); }

.notice { border: 1px dashed var(--line); border-radius: 6px; padding: 18px; color: var(--muted); }
.notice strong { color: var(--ink); }
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>Prop Build Queue</h1>
    <p class="lede">Prop ideas we're weighing for the PEZ family show. Each one gets checked against the controller before anyone starts printing.</p>
  </header>

  <section class="ctrl" aria-labelledby="ctrl-h">
    <div class="ctrl-head">
      <h2 id="ctrl-h">Controller</h2>
      <span class="label" id="ctrl-summary">Loading…</span>
    </div>
    <div class="ports" id="ports"></div>
    <div class="legend" id="ctrl-note"></div>
  </section>

  <main id="queue" class="group" aria-live="polite">
    <div class="notice"><strong>Loading the queue…</strong></div>
  </main>
</div>

<script>
const STATUSES = [["To review", "s-review"], ["Shortlisted", "s-short"], ["Building", "s-build"], ["Built", "s-built"], ["Passed", "s-passed"]];
const cls = Object.fromEntries(STATUSES);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (n.className = v) : n.setAttribute(k, v);
  for (const k of kids) if (k != null) n.append(k);
  return n;
};
const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });

function renderCtrl(ctrl) {
  const used = Object.fromEntries(ctrl.ports.map((p) => [p.port, p]));
  let px = 0;
  const cells = [];
  for (let i = 1; i <= ctrl.portCount; i++) {
    const p = used[i];
    if (p) px += p.px;
    const full = p && p.px >= ctrl.maxPxPerPort * 0.95;
    cells.push(el("div", { class: "port" + (p ? (full ? " full" : "") : " free"), title: p ? `${p.name}: ${p.px} px` : "Free" },
      el("b", {}, String(i)), el("span", {}, p ? String(p.px) : "free")));
  }
  document.getElementById("ports").replaceChildren(...cells);
  const n = ctrl.ports.length;
  document.getElementById("ctrl-summary").textContent = `${ctrl.name} · ${px.toLocaleString()} px on ${n} ports · ${ctrl.portCount - n} free`;
  document.getElementById("ctrl-note").replaceChildren(...ctrl.notes.map((t) => el("span", {}, t)));
}

function card(p) {
  const status = cls[p.status] ? p.status : "To review";
  const rows = el("dl", { class: "rows" });
  const row = (label, text, extra = "") => text && rows.append(el("div", { class: extra }, el("dt", { class: "label" }, label), el("dd", {}, text)));
  row("What", p.what); row("Fit", p.fit); row("Cost", p.cost); row("Watch out", p.caveats);
  if (p.files?.length) row("Files", el("span", {}, ...p.files.flatMap((f, i) => [i ? " · " : null, el("a", { href: f.url, target: "_blank", rel: "noopener" }, f.label)])));
  row("Still need", p.need, "need"); row("Verdict", p.verdict);
  return el("article", { class: "card" },
    el("div", { class: "card-top" },
      el("h3", {}, el("a", { href: p.url, target: "_blank", rel: "noopener" }, p.title || p.url)),
      el("span", { class: "status " + cls[status] }, status)),
    el("div", { class: "meta" }, p.kind ? el("span", {}, p.kind) : null, p.source ? el("span", {}, p.source) : null,
      p.addedAt ? el("span", { class: "mono" }, "added " + fmtDate(p.addedAt)) : null),
    rows);
}

function renderQueue(props) {
  const q = document.getElementById("queue");
  if (!props.length) {
    q.replaceChildren(el("div", { class: "notice" }, el("strong", {}, "No props yet. "), "Send Claude a link to a prop build and it shows up here."));
    return;
  }
  const kids = [];
  for (const [s] of STATUSES) {
    const items = props.filter((p) => (cls[p.status] ? p.status : "To review") === s)
      .sort((a, b) => (b.addedAt || "").localeCompare(a.addedAt || "") || (a.order ?? 0) - (b.order ?? 0));
    if (items.length) kids.push(el("section", { class: "group", "aria-label": s }, el("h2", {}, `${s} · ${items.length}`), ...items.map(card)));
  }
  q.replaceChildren(...kids);
}

fetch("props.json", { cache: "no-store" }).then((r) => r.json()).then((d) => { renderCtrl(d.controller); renderQueue(d.props); })
  .catch(() => document.getElementById("queue").replaceChildren(el("div", { class: "notice" }, el("strong", {}, "Couldn't load props.json. "), "Reload the page.")));
</script>
</body></html>
